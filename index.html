<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Premium Edition</title>
    <style>
        /* MIX: DEEP SLATE APP-LOOK & GLASSMORPHISM */
        :root {
            --bg-gradient: linear-gradient(135deg, #070a12 0%, #0f1424 100%);
            --glass-bg: rgba(21, 27, 43, 0.7);       /* Transparentes Slate */
            --glass-input: rgba(31, 39, 54, 0.6);    /* Etwas helleres Glas für Inputs */
            --accent: #3b82f6;                        /* Modernes Fokus-Blau */
            --text-main: #f8fafc;                     /* Kristallweiß */
            --text-muted: #94a3b8;                    /* Weiches Grau */
            --glass-border: rgba(255, 255, 255, 0.06);/* Ultradünner Glasrand */
            
            /* Edle, matte Statusfarben */
            --rot: #ef4444;
            --gelb: #f59e0b;
            --gruen: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* GLASSMORPHISM LOGIN GATE */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            z-index: 9999;
        }

        .login-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 100%;
            max-width: 360px;
        }

        .login-box h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        /* DASHBOARD CONTENT */
        #dashboardContent {
            display: none;
        }

        header {
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin: 6px 0 0 0;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        h2 {
            margin-top: 0;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
        }

        /* Formular Elemente */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        input, select {
            background: var(--glass-input);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(31, 39, 54, 0.8);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        button {
            background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Listen & Karten mit Glaseffekt */
        .data-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 480px;
            overflow-y: auto;
        }

        .data-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 14px;
            border: 1px solid var(--glass-border);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: background 0.2s ease;
        }

        .data-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .data-item .row-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-right: 25px;
        }

        .data-item .title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .data-item .info {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .data-item a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            width: fit-content;
        }

        .data-item a:hover {
            text-decoration: underline;
        }

        /* Edle Pillen-Badges */
        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .badge-rot { background: rgba(239, 68, 68, 0.12); color: #fc8181; border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge-gelb { background: rgba(245, 158, 11, 0.12); color: #fbd38d; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-gruen { background: rgba(16, 185, 129, 0.12); color: #68d391; border: 1px solid rgba(16, 185, 129, 0.2); }

        /* Integrierter Status-Wechsler im Glas-Look */
        .status-select-inline {
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            width: 160px;
            cursor: pointer;
        }

        .delete-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: var(--rot);
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <div class="login-box">
        <h2>Geschützter Bereich</h2>
        <p>Bitte lizensiertes Admin-Passwort eingeben</p>
        <div class="form-group">
            <input type="password" id="passwordInput" placeholder="Passwort" onkeydown="if(event.key === 'Enter') checkPassword()">
            <button onclick="checkPassword()">Verifizieren</button>
        </div>
    </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="dashboardContent" class="container">
    <header>
        <h1>Admin Workspace</h1>
        <p>Management & PC-Check Koordinationszentrum</p>
    </header>

    <div class="grid">
        <!-- Sektion: Sus Player -->
        <div class="card">
            <h2>Sus Player Tracker</h2>
            <div class="form-group">
                <input type="text" id="susName" placeholder="Spieler Name">
                <input type="text" id="susId" placeholder="Spieler ID">
                <input type="text" id="susProof" placeholder="Beweis Link (YouTube, Imgur)">
                <select id="susStatus">
                    <option value="rot">Rot - Dringend</option>
                    <option value="gelb">Gelb - Kann warten</option>
                    <option value="gruen">Grün - Gecheckt</option>
                </select>
                <button onclick="addEntry('sus')">Eintrag erstellen</button>
            </div>
            <ul id="susList" class="data-list"></ul>
        </div>

        <!-- Sektion: PC-Checker -->
        <div class="card">
            <h2>PC-Checker Queue</h2>
            <div class="form-group">
                <input type="text" id="pcName" placeholder="Name / ID des Spielers">
                <input type="text" id="pcReason" placeholder="Verdachtsmoment (z.B. No-Drag, Hitbox)">
                <select id="pcStatus">
                    <option value="rot">Rot - Dringend</option>
                    <option value="gelb">Gelb - Kann warten</option>
                    <option value="gruen">Grün - Gecheckt</option>
                </select>
                <button onclick="addEntry('pc')">PC-Check anfordern</button>
            </div>
            <ul id="pcList" class="data-list"></ul>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "admin123";

    function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        if (input === ADMIN_PASSWORD) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
            loadData();
        } else {
            alert("Passwort inkorrekt.");
            document.getElementById('passwordInput').value = '';
        }
    }

    function addEntry(type) {
        if (type === 'sus') {
            const name = document.getElementById('susName').value.trim();
            const id = document.getElementById('susId').value.trim();
            const proof = document.getElementById('susProof').value.trim();
            const status = document.getElementById('susStatus').value;

            if (!name || !id) return alert("Bitte Name und ID ausfüllen.");

            const item = { id: Date.now(), name, playerId: id, proof, status };
            saveToStorage('glassSusData', item);
            
            document.getElementById('susName').value = '';
            document.getElementById('susId').value = '';
            document.getElementById('susProof').value = '';

        } else if (type === 'pc') {
            const name = document.getElementById('pcName').value.trim();
            const reason = document.getElementById('pcReason').value.trim();
            const status = document.getElementById('pcStatus').value;

            if (!name) return alert("Bitte Name oder ID eingeben.");

            const item = { id: Date.now(), name, reason: reason || 'Kein spezifischer Verdacht', status };
            saveToStorage('glassPcData', item);

            document.getElementById('pcName').value = '';
            document.getElementById('pcReason').value = '';
        }
        
        loadData();
    }

    function saveToStorage(key, item) {
        let data = JSON.parse(localStorage.getItem(key)) || [];
        data.push(item);
        localStorage.setItem(key, JSON.stringify(data));
    }

    function updateStatus(key, itemId, newStatus) {
        let data = JSON.parse(localStorage.getItem(key)) || [];
        const index = data.findIndex(item => item.id === itemId);
        if (index !== -1) {
            data[index].status = newStatus;
            localStorage.setItem(key, JSON.stringify(data));
            loadData();
        }
    }

    function deleteEntry(key, id) {
        let data = JSON.parse(localStorage.getItem(key)) || [];
        data = data.filter(item => item.id !== id);
        localStorage.setItem(key, JSON.stringify(data));
        loadData();
    }

    function loadData() {
        if (document.getElementById('dashboardContent').style.display !== 'block') return;

        // Sus List
        const susList = document.getElementById('susList');
        susList.innerHTML = '';
        const susData = JSON.parse(localStorage.getItem('glassSusData')) || [];
        susData.reverse().forEach(item => {
            const li = document.createElement('li');
            li.className = 'data-item';
            
            let statusText = item.status === 'rot' ? 'Dringend' : item.status === 'gelb' ? 'Wartend' : 'Gecheckt';

            li.innerHTML = `
                <div class="row-header">
                    <div class="title">${item.name} <span style="color:var(--text-muted); font-size:0.9rem; font-weight:normal;">(ID: ${item.playerId})</span></div>
                    <span class="status-badge badge-${item.status}">${statusText}</span>
                </div>
                ${item.proof ? `<a href="${item.proof}" target="_blank">→ Beweislink öffnen</a>` : '<p class="info">Kein Beweis hinterlegt</p>'}
                
                <select class="status-select-inline" onchange="updateStatus('glassSusData', ${item.id}, this.value)">
                    <option value="rot" ${item.status === 'rot' ? 'selected' : ''}>Status: Rot</option>
                    <option value="gelb" ${item.status === 'gelb' ? 'selected' : ''}>Status: Gelb</option>
                    <option value="gruen" ${item.status === 'gruen' ? 'selected' : ''}>Status: Grün</option>
                </select>

                <button class="delete-btn" onclick="deleteEntry('glassSusData', ${item.id})">×</button>
            `;
            susList.appendChild(li);
        });

        // PC List
        const pcList = document.getElementById('pcList');
        pcList.innerHTML = '';
        const pcData = JSON.parse(localStorage.getItem('glassPcData')) || [];
        pcData.reverse().forEach(item => {
            const li = document.createElement('li');
            li.className = 'data-item';

            let statusText = item.status === 'rot' ? 'Dringend' : item.status === 'gelb' ? 'Wartend' : 'Gecheckt';

            li.innerHTML = `
                <div class="row-header">
                    <div class="title">${item.name}</div>
                    <span class="status-badge badge-${item.status}">${statusText}</span>
                </div>
                <p class="info"><strong>Verdacht:</strong> ${item.reason}</p>
                
                <select class="status-select-inline" onchange="updateStatus('glassPcData', ${item.id}, this.value)">
                    <option value="rot" ${item.status === 'rot' ? 'selected' : ''}>Status: Rot</option>
                    <option value="gelb" ${item.status === 'gelb' ? 'selected' : ''}>Status: Gelb</option>
                    <option value="gruen" ${item.status === 'gruen' ? 'selected' : ''}>Status: Grün</option>
                </select>

                <button class="delete-btn" onclick="deleteEntry('glassPcData', ${item.id})">×</button>
            `;
            pcList.appendChild(li);
        });
    }
</script>

</body>
</html>
