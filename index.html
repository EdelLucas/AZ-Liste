<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIB - Sus Player Datenbank</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #070a12 0%, #0f1424 100%);
            --glass-bg: rgba(21, 27, 43, 0.8);
            --glass-input: rgba(31, 39, 54, 0.6);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.06);
            
            /* Status- & Badge-Farben */
            --rot: #ef4444;
            --gelb: #f59e0b;
            --gruen: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* LOGIN SCREEN */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            z-index: 9999;
        }

        .login-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        .login-box input {
            width: 100%;
            box-sizing: border-box;
            background: var(--glass-input);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-box button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        #dashboardContent {
            display: none;
        }

        header {
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* KOMPAKTER EINTRAGS-BEREICH (OBEN) */
        .input-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input, select {
            background: var(--glass-input);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: rgba(59, 130, 246, 0.5);
            outline: none;
        }

        .add-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:hover {
            filter: brightness(1.1);
        }

        /* LISTE / TABELLEN-STIL */
        .table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            white-space: nowrap;
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        /* BADGES FÜR DIE LISTE */
        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-align: center;
            display: inline-block;
        }
        .bg-ja { background: rgba(239, 68, 68, 0.15); color: #fc8181; border: 1px solid rgba(239, 68, 68, 0.2); }
        .bg-nein { background: rgba(16, 185, 129, 0.15); color: #68d391; border: 1px solid rgba(16, 185, 129, 0.2); }
        
        /* Status Spalten-Auswahl */
        .status-select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: white;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .status-rot { color: #fc8181; border-color: rgba(239, 68, 68, 0.4); }
        .status-gelb { color: #fbd38d; border-color: rgba(245, 158, 11, 0.4); }
        .status-gruen { color: #68d391; border-color: rgba(16, 185, 129, 0.4); }

        /* Clip & Action Buttons */
        .clip-btn {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .clip-btn:hover {
            background: var(--accent);
            color: white;
        }

        .no-clip {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.8rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 5px;
        }

        .delete-btn:hover {
            color: var(--rot);
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <div class="login-box">
        <h2 style="margin-top:0; font-size:1.3rem;">FIB Terminal Login</h2>
        <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:20px;">Autorisierung erforderlich</p>
        <input type="password" id="passwordInput" placeholder="Passwort" onkeydown="if(event.key === 'Enter') checkPassword()">
        <button onclick="checkPassword()">Verbinden</button>
    </div>
</div>

<!-- MAIN DASHBOARD LISTE -->
<div id="dashboardContent" class="container">
    <header>
        <h1>FIB Sus Player Index & Live-Tracker</h1>
        <div style="font-size: 0.85rem; color: var(--text-muted);" id="counter">Einträge: 0</div>
    </header>

    <!-- OBERE LEISTE: NEUER EINTRAG -->
    <div class="input-bar">
        <div class="input-grid">
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="pName" placeholder="Spieler Name">
            </div>
            <div class="input-group">
                <label>ID</label>
                <input type="text" id="pId" placeholder="Spieler ID">
            </div>
            <div class="input-group" style="grid-column: span 2;">
                <label>Grund / Verdacht</label>
                <input type="text" id="pGrund" placeholder="z.B. Hitbox-Verdacht">
            </div>
            <div class="input-group">
                <label>Social ID</label>
                <input type="text" id="pSocId" placeholder="Social ID">
            </div>
            <div class="input-group">
                <label>Social Name</label>
                <input type="text" id="pSocName" placeholder="Social Name">
            </div>
            <div class="input-group">
                <label>Gefleckt</label>
                <select id="pGefleckt">
                    <option value="Nein">Nein</option>
                    <option value="Ja">Ja</option>
                </select>
            </div>
            <div class="input-group">
                <label>Recheck</label>
                <select id="pRecheck">
                    <option value="Nein">Nein</option>
                    <option value="Ja">Ja</option>
                </select>
            </div>
            <div class="input-group">
                <label>PC-C. Verweigert am</label>
                <input type="text" id="pPcVerweigert" placeholder="TT.MM.JJJJ">
            </div>
            <div class="input-group">
                <label>Bann Ablauf</label>
                <input type="text" id="pBannAblauf" placeholder="Datum / Perma">
            </div>
            <div class="input-group">
                <label>Perma</label>
                <select id="pPerma">
                    <option value="Nein">Nein</option>
                    <option value="Ja">Ja</option>
                </select>
            </div>
            <div class="input-group">
                <label>Proof / Clip Link</label>
                <input type="text" id="pProof" placeholder="Link einfügen">
            </div>
            <div class="input-group">
                <label>Status</label>
                <select id="pStatus">
                    <option value="rot">Rot</option>
                    <option value="gelb">Gelb</option>
                    <option value="gruen">Grün</option>
                </select>
            </div>
            <button class="add-btn" onclick="addPlayer()">Eintragen</button>
        </div>
    </div>

    <!-- DIE TABELLARISCHE LISTE -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Name</th>
                    <th>ID</th>
                    <th>Grund / Verdacht</th>
                    <th>Social ID</th>
                    <th>Social Name</th>
                    <th>Gefleckt</th>
                    <th>Recheck</th>
                    <th>PC-C. Verweigert am</th>
                    <th>Bann Ablauf</th>
                    <th>Perma</th>
                    <th>Proof / Clips</th>
                    <th style="width: 40px;"></th>
                </tr>
            </thead>
            <tbody id="playerTableBody">
                <!-- Dynamische Listeneinträge landen hier -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "admin123";

    function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        if (input === ADMIN_PASSWORD) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
            loadData();
        } else {
            alert("Passwort inkorrekt.");
            document.getElementById('passwordInput').value = '';
        }
    }

    function addPlayer() {
        const name = document.getElementById('pName').value.trim();
        const id = document.getElementById('pId').value.trim();
        
        if (!name || !id) return alert("Bitte Name und ID eintragen!");

        const player = {
            dbId: Date.now(),
            name,
            id,
            grund: document.getElementById('pGrund').value.trim() || '-',
            socId: document.getElementById('pSocId').value.trim() || '-',
            socName: document.getElementById('pSocName').value.trim() || '-',
            gefleckt: document.getElementById('pGefleckt').value,
            recheck: document.getElementById('pRecheck').value,
            pcVerweigert: document.getElementById('pPcVerweigert').value.trim() || '-',
            bannAblauf: document.getElementById('pBannAblauf').value.trim() || '-',
            perma: document.getElementById('pPerma').value,
            proof: document.getElementById('pProof').value.trim(),
            status: document.getElementById('pStatus').value
        };

        let data = JSON.parse(localStorage.getItem('lstData')) || [];
        data.push(player);
        localStorage.setItem('lstData', JSON.stringify(data));

        // Input Felder leeren
        document.getElementById('pName').value = ''; document.getElementById('pId').value = '';
        document.getElementById('pGrund').value = ''; document.getElementById('pSocId').value = '';
        document.getElementById('pSocName').value = ''; document.getElementById('pPcVerweigert').value = '';
        document.getElementById('pBannAblauf').value = ''; document.getElementById('pProof').value = '';

        loadData();
    }

    function updateStatus(dbId, newStatus) {
        let data = JSON.parse(localStorage.getItem('lstData')) || [];
        const index = data.findIndex(p => p.dbId === dbId);
        if (index !== -1) {
            data[index].status = newStatus;
            localStorage.setItem('lstData', JSON.stringify(data));
            loadData();
        }
    }

    function deletePlayer(dbId) {
        if(confirm("Eintrag unwiderruflich löschen?")) {
            let data = JSON.parse(localStorage.getItem('lstData')) || [];
            data = data.filter(p => p.dbId !== dbId);
            localStorage.setItem('lstData', JSON.stringify(data));
            loadData();
        }
    }

    function loadData() {
        if (document.getElementById('dashboardContent').style.display !== 'block') return;

        const tbody = document.getElementById('playerTableBody');
        tbody.innerHTML = '';
        
        const data = JSON.parse(localStorage.getItem('lstData')) || [];
        document.getElementById('counter').innerText = `Einträge: ${data.length}`;

        // Die neuesten Einträge oben anzeigen
        data.reverse().forEach(p => {
            const tr = document.createElement('tr');

            // Klassen für die farbige Status-Auswahlbox ermitteln
            let statusClass = p.status === 'rot' ? 'status-rot' : p.status === 'gelb' ? 'status-gelb' : 'status-gruen';

            tr.innerHTML = `
                <td>
                    <select class="status-select ${statusClass}" onchange="updateStatus(${p.dbId}, this.value)">
                        <option value="rot" class="status-rot" ${p.status === 'rot' ? 'selected' : ''}>🔴 ROT</option>
                        <option value="gelb" class="status-gelb" ${p.status === 'gelb' ? 'selected' : ''}>🟡 GELB</option>
                        <option value="gruen" class="status-gruen" ${p.status === 'gruen' ? 'selected' : ''}>🟢 GRÜN</option>
                    </select>
                </td>
                <td style="font-weight: 700; color: #fff;">${p.name}</td>
                <td><span style="color: var(--text-muted); font-family: monospace;">${p.id}</span></td>
                <td>${p.grund}</td>
                <td>${p.socId}</td>
                <td>${p.socName}</td>
                <td><span class="badge ${p.gefleckt === 'Ja' ? 'bg-ja' : 'bg-nein'}">${p.gefleckt}</span></td>
                <td><span class="badge ${p.recheck === 'Ja' ? 'bg-ja' : 'bg-nein'}">${p.recheck}</span></td>
                <td>${p.pcVerweigert}</td>
                <td>${p.bannAblauf}</td>
                <td><span class="badge ${p.perma === 'Ja' ? 'bg-ja' : 'bg-nein'}">${p.perma}</span></td>
                <td>
                    ${p.proof ? `<a href="${p.proof}" target="_blank" class="clip-btn">🎬 Clip öffnen</a>` : '<span class="no-clip">Kein Clip</span>'}
                </td>
                <td>
                    <button class="delete-btn" onclick="deletePlayer(${p.dbId})">×</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
