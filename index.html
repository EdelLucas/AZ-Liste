<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | PC-Checker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --danger-color: #ef4444;
            --text-color: #f1f5f9;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
        }

        h1 { color: var(--accent-color); margin: 0; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .urgent-card {
            border-top: 4px solid var(--danger-color);
        }

        h2 { margin-top: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }

        /* Formular Styling */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        input:focus { border-color: var(--accent-color); }

        button {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.8; }

        .btn-urgent { background: var(--danger-color); color: white; }

        /* Listen Styling */
        .data-list {
            list-style: none;
            padding: 0;
        }

        .data-item {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-color);
            position: relative;
        }

        .data-item.urgent-item { border-left-color: var(--danger-color); }

        .data-item strong { display: block; color: var(--accent-color); }
        .data-item small { color: #94a3b8; }
        .data-item a { color: #fbbf24; text-decoration: none; font-size: 0.9rem; }

        .delete-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            background: none;
            color: var(--danger-color);
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Admin Monitoring System</h1>
        <p>Grand RP - Checker Tool</p>
    </header>

    <div class="grid">
        <!-- Sektion: Verdächtige Spieler -->
        <div class="card">
            <h2>🔍 Sus Player Tracker</h2>
            <div class="form-group">
                <input type="text" id="susName" placeholder="Spieler Name">
                <input type="text" id="susId" placeholder="ID">
                <input type="text" id="susProof" placeholder="Beweis Link (Imgur/YouTube)">
                <button onclick="addEntry('sus')">Eintragen</button>
            </div>
            <ul id="susList" class="data-list"></ul>
        </div>

        <!-- Sektion: Dringende Fälle -->
        <div class="card urgent-card">
            <h2>🚨 Dringend Ziehen</h2>
            <div class="form-group">
                <input type="text" id="urgentName" placeholder="Name oder ID">
                <input type="text" id="urgentReason" placeholder="Grund (z.B. PC Check)">
                <button class="btn-urgent" onclick="addEntry('urgent')">Hinzufügen</button>
            </div>
            <ul id="urgentList" class="data-list"></ul>
        </div>
    </div>
</div>

<script>
    function addEntry(type) {
        if (type === 'sus') {
            const name = document.getElementById('susName').value;
            const id = document.getElementById('susId').value;
            const proof = document.getElementById('susProof').value;

            if (!name || !id) return alert("Bitte Name und ID ausfüllen!");

            const list = document.getElementById('susList');
            const item = document.createElement('li');
            item.className = 'data-item';
            item.innerHTML = `
                <strong>${name} (ID: ${id})</strong>
                <a href="${proof}" target="_blank">🔗 Beweis ansehen</a>
                <span class="delete-btn" onclick="this.parentElement.remove()">×</span>
            `;
            list.prepend(item);
            
            // Felder leeren
            document.getElementById('susName').value = '';
            document.getElementById('susId').value = '';
            document.getElementById('susProof').value = '';

        } else if (type === 'urgent') {
            const name = document.getElementById('urgentName').value;
            const reason = document.getElementById('urgentReason').value;

            if (!name) return alert("Bitte Name/ID eingeben!");

            const list = document.getElementById('urgentList');
            const item = document.createElement('li');
            item.className = 'data-item urgent-item';
            item.innerHTML = `
                <strong>${name}</strong>
                <small>Grund: ${reason || 'Keine Angabe'}</small>
                <span class="delete-btn" onclick="this.parentElement.remove()">×</span>
            `;
            list.prepend(item);

            document.getElementById('urgentName').value = '';
            document.getElementById('urgentReason').value = '';
        }
    }
</script>

</body>
</html>
