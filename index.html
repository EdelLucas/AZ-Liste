<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Neon Control</title>
    <style>
        /* DESIGN: NEON CYBER / GAME CONTROL CENTER */
        :root {
            --bg-color: #050508;       /* Tiefschwarz */
            --card-bg: #0b0c10;        /* Dunkles Panel */
            --accent-color: #00f2fe;   /* Neon Cyan */
            --danger-color: #ff0055;   /* Neon Pink/Rot */
            --text-main: #ffffff;
            --text-muted: #666d7a;
            --border-color: #1f2330;
        }

        body {
            font-family: 'Consolas', 'Courier New', Courier, monospace; /* Gaming / Code Look */
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 1px dashed var(--accent-color);
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0;
            color: var(--text-main);
            text-shadow: 0 0 10px var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            margin: 8px 0 0 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 4px;
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .card.pccheck-card {
            border-color: var(--danger-color);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.15);
        }

        h2 {
            margin-top: 0;
            font-size: 1.3rem;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .sus-title { color: var(--accent-color); text-shadow: 0 0 5px rgba(0, 242, 254, 0.5); }
        .pccheck-title { color: var(--danger-color); text-shadow: 0 0 5px rgba(255, 0, 85, 0.5); }

        /* Formular Styling */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        input {
            background: #000000;
            border: 1px solid var(--border-color);
            color: #00f2fe;
            padding: 12px;
            border-radius: 2px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        input::placeholder {
            color: #333b4d;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
            background: #04060a;
            outline: none;
        }

        .pccheck-card input {
            color: var(--danger-color);
        }

        .pccheck-card input:focus {
            border-color: var(--danger-color);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        button {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 12px;
            border-radius: 2px;
            font-weight: bold;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px var(--accent-color);
        }

        .btn-pccheck {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .btn-pccheck:hover {
            background: var(--danger-color);
            color: #000;
            box-shadow: 0 0 15px var(--danger-color);
        }

        /* Listen & Items */
        .data-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 450px;
            overflow-y: auto;
        }

        .data-item {
            background: #000000;
            padding: 15px;
            border-radius: 2px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-color);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .data-item.pccheck-item {
            border-left-color: var(--danger-color);
        }

        .data-item .title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .data-item .info {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .data-item a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 5px;
            display: inline-block;
        }

        .data-item a:hover {
            text-shadow: 0 0 5px var(--accent-color);
        }

        .delete-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }

        .delete-btn:hover {
            color: var(--danger-color);
            text-shadow: 0 0 5px var(--danger-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SYSTEM // CONTROL_CENTER</h1>
        <p>Grand RP - Admin Management Mode</p>
    </header>

    <div class="grid">
        <!-- Sektion: Verdächtige Spieler -->
        <div class="card">
            <h2 class="sus-title">> SUS_PLAYER_TRACKER</h2>
            <div class="form-group">
                <input type="text" id="susName" placeholder="[SPIELER NAME]">
                <input type="text" id="susId" placeholder="[SPIELER ID]">
                <input type="text" id="susProof" placeholder="[BEWEIS LINK]">
                <button onclick="addEntry('sus')">Eintrag initialisieren</button>
            </div>
            <ul id="susList" class="data-list"></ul>
        </div>

        <!-- Sektion: PC-Checker -->
        <div class="card pccheck-card">
            <h2 class="pccheck-title">> PC_CHECK_QUEUE</h2>
            <div class="form-group">
                <input type="text" id="pcName" placeholder="[SPIELER NAME / ID]">
                <input type="text" id="pcReason" placeholder="[VERDACHT / GRUND]">
                <button class="btn-pccheck" onclick="addEntry('pc')">PC-Check anfordern</button>
            </div>
            <ul id="pcList" class="data-list"></ul>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadData();
    });

    function addEntry(type) {
        if (type === 'sus') {
            const name = document.getElementById('susName').value.trim();
            const id = document.getElementById('susId').value.trim();
            const proof = document.getElementById('susProof').value.trim();

            if (!name || !id) return alert("ERROR: Name und ID erforderlich!");

            const item = { id: Date.now(), name, playerId: id, proof };
            saveToStorage('neonSusData', item);
            
            document.getElementById('susName').value = '';
            document.getElementById('susId').value = '';
            document.getElementById('susProof').value = '';

        } else if (type === 'pc') {
            const name = document.getElementById('pcName').value.trim();
            const reason = document.getElementById('pcReason').value.trim();

            if (!name) return alert("ERROR: Name oder ID erforderlich!");

            const item = { id: Date.now(), name, reason: reason || 'Kein spezifischer Verdacht' };
            saveToStorage('neonPcData', item);

            document.getElementById('pcName').value = '';
            document.getElementById('pcReason').value = '';
        }
        
        loadData();
    }

    function saveToStorage(key, item) {
        let data = JSON.parse(localStorage.getItem(key)) || [];
        data.push(item);
        localStorage.setItem(key, JSON.stringify(data));
    }

    function deleteEntry(key, id) {
        let data = JSON.parse(localStorage.getItem(key)) || [];
        data = data.filter(item => item.id !== id);
        localStorage.setItem(key, JSON.stringify(data));
        loadData();
    }

    function loadData() {
        const susList = document.getElementById('susList');
        susList.innerHTML = '';
        const susData = JSON.parse(localStorage.getItem('neonSusData')) || [];
        susData.reverse().forEach(item => {
            const li = document.createElement('li');
            li.className = 'data-item';
            li.innerHTML = `
                <div class="title">${item.name} <span style="color:var(--text-muted); font-size:0.9rem;">(ID: ${item.playerId})</span></div>
                ${item.proof ? `<a href="${item.proof}" target="_blank">// BEWEIS_LINK ÖFFNEN</a>` : '<span class="info">Kein Beweis</span>'}
                <button class="delete-btn" onclick="deleteEntry('neonSusData', ${item.id})">×</button>
            `;
            susList.appendChild(li);
        });

        const pcList = document.getElementById('pcList');
        pcList.innerHTML = '';
        const pcData = JSON.parse(localStorage.getItem('neonPcData')) || [];
        pcData.reverse().forEach(item => {
            const li = document.createElement('li');
            li.className = 'data-item pccheck-item';
            li.innerHTML = `
                <div class="title" style="color:var(--danger-color);">${item.name}</div>
                <div class="info"><strong>Status:</strong> ${item.reason}</div>
                <button class="delete-btn" onclick="deleteEntry('neonPcData', ${item.id})">×</button>
            `;
            pcList.appendChild(li);
        });
    }
</script>

</body>
</html>
