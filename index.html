<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Advanced Tracker</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #070a12 0%, #0f1424 100%);
            --glass-bg: rgba(21, 27, 43, 0.75);
            --glass-input: rgba(31, 39, 54, 0.6);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.06);
            
            /* Status Farben */
            --rot: #ef4444;
            --gelb: #f59e0b;
            --gruen: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* LOGIN SCREEN */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            z-index: 9999;
        }

        .login-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 360px;
        }

        /* DASHBOARD CONTENT */
        #dashboardContent {
            display: none;
        }

        header {
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            height: fit-content;
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        /* Formular Felder */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select, textarea {
            background: var(--glass-input);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(31, 39, 54, 0.8);
            outline: none;
        }

        button {
            background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        /* Listen-Einträge */
        .data-list {
            list-style: none;
            padding: 0;
            margin: 25px 0 0 0;
            max-height: 600px;
            overflow-y: auto;
        }

        .data-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--glass-border);
            position: relative;
        }

        .data-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .item-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-right: 30px;
        }

        .player-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }

        .proof-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }

        .proof-link:hover { text-decoration: underline; }

        /* Badges */
        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .bg-rot { background: rgba(239, 68, 68, 0.15); color: #fc8181; }
        .bg-gelb { background: rgba(245, 158, 11, 0.15); color: #fbd38d; }
        .bg-gruen { background: rgba(16, 185, 129, 0.15); color: #68d391; }
        
        .badge-inline {
            padding: 2px 6px;
            font-size: 0.8rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .delete-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .delete-btn:hover { color: var(--rot); }

        /* Status Inline Wechsler */
        .status-inline {
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
            padding: 5px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <div class="login-box">
        <h2>Geschützter Zugriff</h2>
        <p>Bitte Admin-Passwort eingeben</p>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <input type="password" id="passwordInput" placeholder="Passwort" onkeydown="if(event.key === 'Enter') checkPassword()">
            <button onclick="checkPassword()">Anmelden</button>
        </div>
    </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="dashboardContent" class="container">
    <header>
        <h1>Admin Management Dashboard</h1>
        <p>Live-Überwachung & Beweisdatenbank</p>
    </header>

    <div class="grid">
        <!-- LINKER BEREICH: SPIELER TRACKER -->
        <div class="card">
            <h2>Sus Player Ermittlung</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Spieler Name</label>
                    <input type="text" id="pName" placeholder="z.B. Tim Chessee">
                </div>
                <div class="form-group">
                    <label>Spieler ID</label>
                    <input type="text" id="pId" placeholder="z.B. 48392">
                </div>
                <div class="form-group full-width">
                    <label>Verdacht / Grund</label>
                    <input type="text" id="pGrund" placeholder="z.B. No-Drag, Hitbox, Cheating-Verdacht">
                </div>
                <div class="form-group full-width">
                    <label>Proof / Beweis-Link</label>
                    <input type="text" id="pProof" placeholder="YouTube, Medal, Imgur Link">
                </div>
                
                <div class="form-group">
                    <label>Social ID</label>
                    <input type="text" id="pSocId" placeholder="Social Club ID">
                </div>
                <div class="form-group">
                    <label>Social Name</label>
                    <input type="text" id="pSocName" placeholder="Social Club Name">
                </div>

                <div class="form-group">
                    <label>Gefleckt?</label>
                    <select id="pGefleckt">
                        <option value="Nein">Nein</option>
                        <option value="Ja">Ja</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Recheck erforderlich?</label>
                    <select id="pRecheck">
                        <option value="Nein">Nein</option>
                        <option value="Ja">Ja</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>PC-Check verweigert am</label>
                    <input type="date" id="pPcVerweigert">
                </div>
                <div class="form-group">
                    <label>Wann läuft der Bann ab?</label>
                    <input type="text" id="pBannAblauf" placeholder="z.B. 12.08.2026 oder Permanent">
                </div>

                <div class="form-group">
                    <label>Perma eingetragen?</label>
                    <select id="pPerma">
                        <option value="Nein">Nein</option>
                        <option value="Ja">Ja</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Dringlichkeits-Status</label>
                    <select id="pStatus">
                        <option value="rot">Rot - Dringend</option>
                        <option value="gelb">Gelb - Kann warten</option>
                        <option value="gruen">Grün - Wurde gecheckt</option>
                    </select>
                </div>
            </div>
            <button onclick="addPlayer()">Spielerakte anlegen</button>

            <ul id="playerList" class="data-list"></ul>
        </div>

        <!-- RECHTER BEREICH: CLIP & VIDEO SPEICHER -->
        <div class="card">
            <h2>Clip-Archiv & Aufnahmen</h2>
            <div class="form-group">
                <label>Clip-Titel / Beschreibung</label>
                <input type="text" id="clipTitle" placeholder="z.B. PC-Check von ID 1234">
            </div>
            <div class="form-group">
                <label>Video-Link</label>
                <input type="text" id="clipUrl" placeholder="YouTube, Medal Link einfügen">
            </div>
            <button onclick="addClip()">Clip sichern</button>

            <ul id="clipList" class="data-list"></ul>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "admin123";

    function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        if (input === ADMIN_PASSWORD) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
            loadData();
        } else {
            alert("Passwort inkorrekt.");
            document.getElementById('passwordInput').value = '';
        }
    }

    // Spieler hinzufügen
    function addPlayer() {
        const name = document.getElementById('pName').value.trim();
        const id = document.getElementById('pId').value.trim();
        if (!name || !id) return alert("Bitte mindestens Name und ID eingeben!");

        const player = {
            dbId: Date.now(),
            name,
            id,
            grund: document.getElementById('pGrund').value.trim() || 'Kein Grund hinterlegt',
            proof: document.getElementById('pProof').value.trim(),
            socId: document.getElementById('pSocId').value.trim() || 'Nicht angegeben',
            socName: document.getElementById('pSocName').value.trim() || 'Nicht angegeben',
            gefleckt: document.getElementById('pGefleckt').value,
            recheck: document.getElementById('pRecheck').value,
            pcVerweigert: document.getElementById('pPcVerweigert').value || 'Kein Eintrag',
            bannAblauf: document.getElementById('pBannAblauf').value.trim() || 'Kein Eintrag',
            perma: document.getElementById('pPerma').value,
            status: document.getElementById('pStatus').value
        };

        let data = JSON.parse(localStorage.getItem('advPlayers')) || [];
        data.push(player);
        localStorage.setItem('advPlayers', JSON.stringify(data));

        // Formular leeren
        document.getElementById('pName').value = ''; document.getElementById('pId').value = '';
        document.getElementById('pGrund').value = ''; document.getElementById('pProof').value = '';
        document.getElementById('pSocId').value = ''; document.getElementById('pSocName').value = '';
        document.getElementById('pPcVerweigert').value = ''; document.getElementById('pBannAblauf').value = '';

        loadData();
    }

    // Clip hinzufügen
    function addClip() {
        const title = document.getElementById('clipTitle').value.trim();
        const url = document.getElementById('clipUrl').value.trim();
        if (!title || !url) return alert("Bitte Titel und Video-Link eingeben!");

        const clip = { dbId: Date.now(), title, url };
        let data = JSON.parse(localStorage.getItem('advClips')) || [];
        data.push(clip);
        localStorage.setItem('advClips', JSON.stringify(data));

        document.getElementById('clipTitle').value = '';
        document.getElementById('clipUrl').value = '';

        loadData();
    }

    function updatePlayerStatus(dbId, newStatus) {
        let data = JSON.parse(localStorage.getItem('advPlayers')) || [];
        const index = data.findIndex(p => p.dbId === dbId);
        if (index !== -1) {
            data[index].status = newStatus;
            localStorage.setItem('advPlayers', JSON.stringify(data));
            loadData();
        }
    }

    function deleteEntry(key, dbId) {
        let data = JSON.parse(localStorage.getItem(key)) || [];
        data = data.filter(item => item.dbId !== dbId);
        localStorage.setItem(key, JSON.stringify(data));
        loadData();
    }

    function loadData() {
        if (document.getElementById('dashboardContent').style.display !== 'block') return;

        // Spieler auslesen
        const pList = document.getElementById('playerList');
        pList.innerHTML = '';
        const players = JSON.parse(localStorage.getItem('advPlayers')) || [];
        players.reverse().forEach(p => {
            const li = document.createElement('li');
            li.className = 'data-item';
            
            let statusText = p.status === 'rot' ? 'Dringend' : p.status === 'gelb' ? 'Kann warten' : 'Gecheckt';

            li.innerHTML = `
                <div class="item-header">
                    <div class="player-title">${p.name} <span style="color:var(--text-muted); font-size:0.95rem; font-weight:normal;">(ID: ${p.id})</span></div>
                    <span class="badge bg-${p.status}">${statusText}</span>
                </div>
                <div style="margin: 5px 0;"><strong style="color:var(--accent);">Grund:</strong> ${p.grund}</div>
                
                <div class="item-grid">
                    <div><strong>Social ID:</strong> ${p.socId}</div>
                    <div><strong>Social Name:</strong> ${p.socName}</div>
                    <div><strong>Gefleckt:</strong> <span class="badge-inline ${p.gefleckt === 'Ja' ? 'bg-rot' : 'bg-gruen'}">${p.gefleckt}</span></div>
                    <div><strong>Recheck:</strong> <span class="badge-inline ${p.recheck === 'Ja' ? 'bg-gelb' : 'bg-gruen'}">${p.recheck}</span></div>
                    <div><strong>PC-Check verweigert:</strong> ${p.pcVerweigert}</div>
                    <div><strong>Bann läuft ab:</strong> ${p.bannAblauf}</div>
                    <div><strong>Perma eingetragen:</strong> <span class="badge-inline ${p.perma === 'Ja' ? 'bg-rot' : 'bg-gruen'}">${p.perma}</span></div>
                </div>

                <div style="margin-top: 10px;">
                    ${p.proof ? `<a class="proof-link" href="${p.proof}" target="_blank">➔ Beweis-Link öffnen</a>` : '<span style="color:var(--text-muted); font-size:0.9rem;">Kein Beweis-Link</span>'}
                </div>

                <select class="status-inline" onchange="updatePlayerStatus(${p.dbId}, this.value)">
                    <option value="rot" ${p.status === 'rot' ? 'selected' : ''}>Status: Rot</option>
                    <option value="gelb" ${p.status === 'gelb' ? 'selected' : ''}>Status: Gelb</option>
                    <option value="gruen" ${p.status === 'gruen' ? 'selected' : ''}>Status: Grün</option>
                </select>

                <button class="delete-btn" onclick="deleteEntry('advPlayers', ${p.dbId})">×</button>
            `;
            pList.appendChild(li);
        });

        // Clips auslesen
        const cList = document.getElementById('clipList');
        cList.innerHTML = '';
        const clips = JSON.parse(localStorage.getItem('advClips')) || [];
        clips.reverse().forEach(c => {
            const li = document.createElement('li');
            li.className = 'data-item';
            li.innerHTML = `
                <div class="player-title" style="font-size:1.05rem; margin-bottom:5px;">${c.title}</div>
                <a class="proof-link" href="${c.url}" target="_blank">➔ Video abspielen</a>
                <button class="delete-btn" onclick="deleteEntry('advClips', ${c.dbId})">×</button>
            `;
            cList.appendChild(li);
        });
    }
</script>

</body>
</html>
